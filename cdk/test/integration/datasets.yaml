datasets:
  epoch_ms:
    table: t-epoch-ms
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: epoch_ms }
    keys: { pattern: "^room-[0-9]{2}$" }
    fields: [{ name: temperature }]
    limits: { maxKeys: 3 }
  iso_prefix:
    table: t-single
    partitionKey: { name: pk, template: "room#{key}" }
    sortKey: { name: sk, format: iso8601, prefix: "TEMP#" }
    keys: { values: [a, b] }
    fields: [{ name: temperature }]
  iso_local:
    table: t-iso-local
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: iso8601, timezone: Asia/Tokyo }
    keys: { values: [d1] }
    fields: [{ name: v }]
  daily_jst:
    table: t-daily
    partitionKey: { name: pk, template: "{key}#{yyyy-MM-dd}", bucket: daily, timezone: Asia/Tokyo }
    sortKey: { name: ts, format: epoch_s }
    keys: { pattern: "^m[0-9]$" }
    fields: [{ name: watt }]
  gsi:
    table: t-gsi
    index: byRoom
    partitionKey: { name: room }
    sortKey: { name: ts, format: epoch_ms }
    keys: { values: [r1] }
    fields: [{ name: v }]
  paging:
    table: t-epoch-ms
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: epoch_ms }
    keys: { values: [big] }
    fields: [{ name: pad, type: string }]
  paging_cut:
    table: t-epoch-ms
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: epoch_ms }
    keys: { values: [big] }
    fields: [{ name: pad, type: string }]
    limits: { maxItems: 1000 }
  paging_pages:
    table: t-epoch-ms
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: epoch_ms }
    keys: { values: [big] }
    fields: [{ name: pad, type: string }]
    limits: { maxPages: 2 }
  wrong_type:
    table: t-epoch-ms
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: iso8601 }
    keys: { values: [room-01] }
    fields: [{ name: temperature }]
  transform:
    table: t-transform
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: epoch_ms }
    keys: { values: [x] }
    fields:
      - { name: temperature, alias: temp_c, unit: celsius, scale: 0.1 }
      - { name: humidity, unit: percent }
      - { name: meta.fw, type: string }
      - { name: meta, type: json, alias: meta_json }
      - { name: "on", type: boolean }
      - { name: flag, type: boolean }
      - { name: tags, type: json }
      - { name: count, type: number }
      - { name: date, type: string }
  agg:
    table: t-agg
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: epoch_ms }
    keys: { values: [a, b] }
    fields:
      - { name: value, unit: celsius }
      - { name: label, type: string }
  paging_rcu:
    table: t-epoch-ms
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: epoch_ms }
    keys: { values: [big] }
    fields: [{ name: pad, type: string }]
    limits: { maxRcu: 100 }
  cache_short:
    table: t-agg
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: epoch_ms }
    keys: { values: [a, b] }
    fields: [{ name: value }]
    cacheTtlSeconds: 1
  cache_off:
    table: t-agg
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: epoch_ms }
    keys: { values: [a, b] }
    fields: [{ name: value }]
    cacheTtlSeconds: 0
  list_keys:
    description: 登録用アイテムからキー一覧を返す
    table: t-single
    partitionKey: { name: pk, template: "room#{key}" }
    sortKey: { name: sk, format: iso8601, prefix: "TEMP#" }
    keys:
      pattern: "^[a-z]$"
      list: { partitionValue: devices, attribute: id }
    fields: [{ name: temperature, unit: celsius }]
  list_nested:
    table: t-single
    partitionKey: { name: pk, template: "room#{key}" }
    sortKey: { name: sk, format: iso8601, prefix: "TEMP#" }
    keys:
      pattern: "^[a-z]$"
      list: { partitionValue: devices, attribute: info.code }
    fields: [{ name: temperature }]
  paging_huge:
    table: t-epoch-ms
    partitionKey: { name: deviceId }
    sortKey: { name: ts, format: epoch_ms }
    keys: { values: [huge] }
    fields: [{ name: pad, type: string }]
