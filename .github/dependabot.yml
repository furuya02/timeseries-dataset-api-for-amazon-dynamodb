version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*", "@smithy/*", "@aws-crypto/*"]
      aws-cdk:
        patterns: ["aws-cdk", "aws-cdk-lib", "constructs"]
      dev-tools:
        dependency-type: development
    ignore:
      # Keep @types/node on the major version of the Node.js runtime (22 / 24)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /grafana
    schedule:
      interval: weekly
